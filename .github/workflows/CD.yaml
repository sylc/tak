name: release

on:
  push:
    # tags:
    #   - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          echo ${{ github.ref_name }}
          echo ${{ github.ref_name }} > version.txt
          deno task install && deno task dist
      - uses: microsoft/setup-WinAppCli@v0.1
      - name: Windows msix
        shell: bash
        run:  |
          echo "${{ secrets.APPX_CERT }}" | base64 --decode > cert.pfx
          echo "${{ github.workspace }}/cert.pfx"
          APPX_CERT="${{ github.workspace }}/cert.pfx" deno task pack
          ls ./dist
      # - name: Release
      #   uses: softprops/action-gh-release@v2
